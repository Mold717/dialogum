<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --slate-black: #0F1A23;
  }
  body { font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45; padding: 20px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate-black); margin-bottom: 14px; }
  .reseau { background: var(--slate-black); padding: 18px 28px; }
  .reseau .section-label { color: #fff; margin-bottom: 14px; }
  .reseau-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .reseau-item .img-placeholder { width: 100%; aspect-ratio: 4/3; border-radius: 3px; background: linear-gradient(135deg, #2a3d4f 0%, #1a2d3f 100%); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .reseau-item .img-placeholder svg { width: 28px; height: 28px; color: rgba(255,255,255,0.4); }
  .reseau-item p { font-size: 9.5px; color: rgba(255,255,255,0.7); text-align: center; }
</style>
</head>
<body>
<div class="reseau">
  <div class="section-label">Notre réseau institutionnel</div>
  <div class="reseau-grid">
    <div class="reseau-item"><div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><p>Universités</p></div>
    <div class="reseau-item"><div class="img-placeholder" style="background:linear-gradient(135deg,#1e3a50 0%,#0e2030 100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><p>Centres techniques</p></div>
    <div class="reseau-item"><div class="img-placeholder" style="background:linear-gradient(135deg,#2a3d4f 0%,#1a2a35 100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><p>Hôpitaux</p></div>
    <div class="reseau-item"><div class="img-placeholder" style="background:linear-gradient(135deg,#1a3040 0%,#0d1e28 100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div><p>Entreprises industrielles</p></div>
    <div class="reseau-item"><div class="img-placeholder" style="background:linear-gradient(135deg,#253545 0%,#152030 100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><p>Institutions publiques</p></div>
    <div class="reseau-item"><div class="img-placeholder" style="background:linear-gradient(135deg,#1e3545 0%,#0e2030 100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div><p>Entreprises services</p></div>
  </div>
</div>
</body>
</html>
